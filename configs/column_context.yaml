experiment_name: cass_w2w3_kernel7_splitseed7

data:
  sample_mode: column
  ensemble_root: /p/lustre5/bogensch/ERF_shcu_ensemble
  case_prefix: shcu_50m_
  post_processed_subdir: post_processed_output/training_data_height_adjusted
  input_filename: training_inputs_coarse_grained.3.2km.zadjust.nc
  target_filename: training_targets_coarse_grained_3.2km.zadjust.nc
  # Optional controls for curating the day set:
  #days: [19000101, 19000102, 19000103]
  exclude_days: []
  predictor_3d:
    - theta_liq
    - qt
    - rho
    - pressure
    - u_wind
    - v_wind
    - qc
  predictor_2d:
    - shf
    - lhf
  derived_predictors:
    - height_m
    - height_norm
    - dtheta_liq_dz
    - dqt_dz
    - du_wind_dz
    - dv_wind_dz
  targets:
    - w_prime_2
    - w_prime_3
  target_transforms:
    w_prime_2: log1p_standardize
    w_prime_3: standardize

split:
  train_fraction: 0.75
  val_fraction: 0.125
  test_fraction: 0.125
  shuffle_days: true
  seed: 7

model:
  type: column_conv
  hidden_channels: [64, 64, 64, 32]
  kernel_size: 7
  activation: gelu
  dropout: 0.05

training:
  seed: 7
  batch_size: 1024
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  train_shuffle_mode: once
  train_shuffle_seed: 7
  output_root: outputs

importance:
  enabled: true
  split: val
  repeats: 3
  max_samples: 2000
  seed: 17
